name: Build and Push Multi-Arch Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            platforms: linux/amd64,linux/arm64
            tag_suffix: cpu
          - device: gpu
            platforms: linux/amd64
            tag_suffix: gpu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./resource
          file: ./resource/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            TARGET_DEVICE=${{ matrix.device }}
          tags: |
            deepkeepx/tts-api:${{ github.ref_name }}-${{ matrix.tag_suffix }}
            deepkeepx/tts-api:latest-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=${{ matrix.device }}